<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Detail Preserve Image Resizer (standalone)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "bg-dark": "#111111",
              "text-light": "#eeeeee",
              "border-dark": "#333333",
              "bg-input": "#0b0b0b",
            },
          },
        },
      };
    </script>
    <!-- React, ReactDOM and Babel from unpkg (online). If you prefer to run behind a server, use the build option. -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="m-0 font-sans bg-[#111] text-[#eee]">
    <div id="root"></div>

    <!-- The component code (using Babel in-browser to transpile JSX) -->
    <script type="text/babel">
      const { useRef, useState, useEffect, useCallback } = React;

      function DetailPreserveImageResizer() {
        const CANVAS_W = 3264;
        const CANVAS_H = 4440;
        const BG_COLOR = "#808080";

        // embedded overlay data URI (may be empty)
        const OVERLAY_SRC = "/overlay.png";

        const containerRef = useRef(null);
        const canvasRef = useRef(null);
        const [canvasScale, setCanvasScale] = useState(0.25);

        const [imageObj, setImageObj] = useState(null);
        const [overlayObj, setOverlayObj] = useState(null);
        const [showOverlay, setShowOverlay] = useState(true);

        const [imgState, setImgState] = useState({
          x: 100,
          y: 100,
          w: 800,
          h: 600,
        });
        const [keepAspect, setKeepAspect] = useState(true);
        const [dragging, setDragging] = useState(false);
        const [dragOffset, setDragOffset] = useState({ dx: 0, dy: 0 });
        const [resizingHandle, setResizingHandle] = useState(null);
        const [origAspect, setOrigAspect] = useState(1);
        const [resizeAlgorithm, setResizeAlgorithm] =
          useState("detail-preserve");
        const [isProcessing, setIsProcessing] = useState(false);

        // ---- DPI override state + effect ----
        const [dpiOverride, setDpiOverride] = useState(""); // empty = disabled

        useEffect(() => {
          if (!dpiOverride) return;
          const dpi = Number(dpiOverride);
          if (!dpi || dpi <= 0) return;

          if (!imageObj || !imageObj.naturalWidth || !imageObj.naturalHeight)
            return;

          // scaling factor = 1200 / DPI
          const factor = 1200 / dpi;

          // base size comes from ORIGINAL image pixels (ignores prior manual scaling)
          let newW = Math.max(1, Math.round(imageObj.naturalWidth * factor));
          let newH = Math.max(1, Math.round(imageObj.naturalHeight * factor));

          if (keepAspect) {
            const natAspect = imageObj.naturalWidth / imageObj.naturalHeight;
            if (newW / newH > natAspect) {
              newW = Math.round(newH * natAspect);
            } else {
              newH = Math.round(newW / natAspect);
            }
          }

          // preserve visual center so the image doesn’t jump
          setImgState((prev) => {
            const cx = prev.x + prev.w / 2;
            const cy = prev.y + prev.h / 2;
            return {
              ...prev,
              x: Math.round(cx - newW / 2),
              y: Math.round(cy - newH / 2),
              w: newW,
              h: newH,
            };
          });
        }, [dpiOverride, imageObj, keepAspect]);

        useEffect(() => {
          if (!OVERLAY_SRC) return;
          const img = new Image();
          img.onload = () => setOverlayObj(img);
          img.onerror = () => setOverlayObj(null);
          img.src = OVERLAY_SRC;
        }, [OVERLAY_SRC]);

        const onFile = (e) => {
          const f = e.target.files?.[0];
          if (!f) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
              setImageObj(img);
              const aspect = img.width / img.height;
              setOrigAspect(aspect);
              const maxW = CANVAS_W * 0.8;
              const maxH = CANVAS_H * 0.8;
              let w = img.width;
              let h = img.height;
              const scale = Math.min(maxW / w, maxH / h, 1);
              w = Math.round(w * scale);
              h = Math.round(h * scale);
              setImgState({
                x: Math.round((CANVAS_W - w) / 2),
                y: Math.round((CANVAS_H - h) / 2),
                w,
                h,
              });
            };
            img.src = ev.target.result;
          };
          reader.readAsDataURL(f);
        };

        const drawPreview = useCallback(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext("2d");
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = BG_COLOR;
          ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

          if (imageObj) {
            ctx.save();
            ctx.drawImage(
              imageObj,
              imgState.x,
              imgState.y,
              imgState.w,
              imgState.h,
            );
            ctx.strokeStyle = "rgba(255,255,255,0.9)";
            ctx.lineWidth = 2;
            ctx.strokeRect(
              imgState.x + 0.5,
              imgState.y + 0.5,
              imgState.w,
              imgState.h,
            );

            const handleSize = 36;
            const corners = [
              [imgState.x, imgState.y, "nw"],
              [imgState.x + imgState.w, imgState.y, "ne"],
              [imgState.x, imgState.y + imgState.h, "sw"],
              [imgState.x + imgState.w, imgState.y + imgState.h, "se"],
            ];
            ctx.fillStyle = "rgba(0,0,0,0.6)";
            ctx.strokeStyle = "white";
            corners.forEach(([cx, cy]) => {
              ctx.beginPath();
              ctx.rect(
                cx - handleSize / 2,
                cy - handleSize / 2,
                handleSize,
                handleSize,
              );
              ctx.fill();
              ctx.stroke();
            });

            ctx.restore();
          } else {
            ctx.fillStyle = "rgba(0,0,0,0.25)";
            ctx.fillRect(24, 24, CANVAS_W - 48, CANVAS_H - 48);
            ctx.fillStyle = "white";
            ctx.font = "24px sans-serif";
            ctx.fillText("Drop or upload an image to start", 40, 64);
          }

          if (showOverlay && overlayObj) {
            ctx.drawImage(overlayObj, 0, 0, CANVAS_W, CANVAS_H);
          }
        }, [imageObj, imgState, showOverlay, overlayObj]);

        useEffect(() => {
          const preview = canvasRef.current;
          if (!preview) return;
          preview.width = CANVAS_W;
          preview.height = CANVAS_H;
          drawPreview();
        }, [drawPreview]);

        useEffect(
          () => drawPreview(),
          [drawPreview, imgState, imageObj, showOverlay, overlayObj],
        );

        const getMousePos = (e) => {
          const canvas = canvasRef.current;
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          return {
            x: Math.round((e.clientX - rect.left) * scaleX),
            y: Math.round((e.clientY - rect.top) * scaleY),
          };
        };

        const pointInRect = (px, py, rx, ry, rw, rh) =>
          px >= rx && px <= rx + rw && py >= ry && py <= ry + rh;

        const handleMouseDown = (e) => {
          if (!imageObj) return;
          const pos = getMousePos(e);
          const hs = 18;
          const corners = [
            { cx: imgState.x, cy: imgState.y, name: "nw" },
            { cx: imgState.x + imgState.w, cy: imgState.y, name: "ne" },
            { cx: imgState.x, cy: imgState.y + imgState.h, name: "sw" },
            {
              cx: imgState.x + imgState.w,
              cy: imgState.y + imgState.h,
              name: "se",
            },
          ];
          for (const c of corners) {
            if (
              pointInRect(pos.x, pos.y, c.cx - hs / 2, c.cy - hs / 2, hs, hs)
            ) {
              setResizingHandle(c.name);
              setDragging(false);
              return;
            }
          }
          if (
            pointInRect(
              pos.x,
              pos.y,
              imgState.x,
              imgState.y,
              imgState.w,
              imgState.h,
            )
          ) {
            setDragging(true);
            setResizingHandle(null);
            setDragOffset({ dx: pos.x - imgState.x, dy: pos.y - imgState.y });
          }
        };

        const handleMouseMove = (e) => {
          if (!imageObj) return;
          const pos = getMousePos(e);
          if (dragging) {
            const nx = pos.x - dragOffset.dx;
            const ny = pos.y - dragOffset.dy;
            setImgState((s) => ({ ...s, x: nx, y: ny }));
          } else if (resizingHandle) {
            let { x, y, w, h } = imgState;
            const minSize = 20;
            if (resizingHandle === "nw") {
              const newW = w + (x - pos.x);
              const newH = h + (y - pos.y);
              let finalW = Math.max(minSize, newW);
              let finalH = Math.max(minSize, newH);
              if (keepAspect) {
                const expectedH = Math.round(finalW / origAspect);
                finalH = expectedH;
              }
              const finalX = x + (w - finalW);
              const finalY = y + (h - finalH);
              setImgState({ x: finalX, y: finalY, w: finalW, h: finalH });
            } else if (resizingHandle === "ne") {
              const newW = pos.x - x;
              const newH = h + (y - pos.y);
              let finalW = Math.max(minSize, newW);
              let finalH = Math.max(minSize, newH);
              if (keepAspect) {
                const expectedH = Math.round(finalW / origAspect);
                finalH = expectedH;
              }
              const finalY = y + (h - finalH);
              setImgState({ x, y: finalY, w: finalW, h: finalH });
            } else if (resizingHandle === "sw") {
              const newW = w + (x - pos.x);
              const newH = pos.y - y;
              let finalW = Math.max(minSize, newW);
              let finalH = Math.max(minSize, newH);
              if (keepAspect) {
                finalH = Math.round(finalW / origAspect);
              }
              const finalX = x + (w - finalW);
              setImgState({ x: finalX, y, w: finalW, h: finalH });
            } else if (resizingHandle === "se") {
              const newW = pos.x - x;
              const newH = pos.y - y;
              let finalW = Math.max(minSize, newW);
              let finalH = Math.max(minSize, newH);
              if (keepAspect) {
                finalH = Math.round(finalW / origAspect);
              }
              setImgState({ x, y, w: finalW, h: finalH });
            }
          }
        };

        const handleMouseUp = () => {
          setDragging(false);
          setResizingHandle(null);
        };

        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          canvas.addEventListener("mousedown", handleMouseDown);
          window.addEventListener("mousemove", handleMouseMove);
          window.addEventListener("mouseup", handleMouseUp);
          return () => {
            canvas.removeEventListener("mousedown", handleMouseDown);
            window.removeEventListener("mousemove", handleMouseMove);
            window.removeEventListener("mouseup", handleMouseUp);
          };
        }, [
          imageObj,
          dragging,
          dragOffset,
          resizingHandle,
          imgState,
          keepAspect,
          origAspect,
        ]);

        useEffect(() => {
          const onKey = (ev) => {
            if (!imageObj) return;
            if (
              ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(
                ev.key,
              )
            ) {
              ev.preventDefault();
              setImgState((s) => {
                if (ev.key === "ArrowLeft") return { ...s, x: s.x - 1 };
                if (ev.key === "ArrowRight") return { ...s, x: s.x + 1 };
                if (ev.key === "ArrowUp") return { ...s, y: s.y - 1 };
                if (ev.key === "ArrowDown") return { ...s, y: s.y + 1 };
                return s;
              });
            }
          };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, [imageObj]);

        // Responsive canvas scale calculation
        useEffect(() => {
          const calculateScale = () => {
            // Use window width for more reliable calculation
            const windowWidth = window.innerWidth;
            const padding = 48; // Account for padding (24px on each side on mobile)
            const availableWidth = windowWidth - padding;

            // Calculate scale to fit canvas width within available space
            // Canvas is 3264px wide, we want it to fit comfortably
            let scale = 0.25; // Default desktop scale

            if (availableWidth < 400) {
              // Very small screens (mobile) - scale to fit width with some margin
              scale = Math.max(
                0.08,
                Math.min(0.12, (availableWidth * 0.9) / CANVAS_W),
              );
            } else if (availableWidth < 640) {
              // Small mobile screens
              scale = Math.max(
                0.12,
                Math.min(0.18, (availableWidth * 0.85) / CANVAS_W),
              );
            } else if (availableWidth < 768) {
              // Tablets
              scale = Math.max(
                0.15,
                Math.min(0.2, (availableWidth * 0.8) / CANVAS_W),
              );
            } else if (availableWidth < 1024) {
              // Medium screens
              scale = 0.2;
            } else {
              // Large screens (desktop)
              scale = 0.25;
            }

            setCanvasScale(scale);
          };

          calculateScale();
          window.addEventListener("resize", calculateScale);
          return () => window.removeEventListener("resize", calculateScale);
        }, []);

        const centerHorizontally = () => {
          setImgState((s) => ({ ...s, x: Math.round((CANVAS_W - s.w) / 2) }));
        };
        const centerVertically = () => {
          setImgState((s) => ({ ...s, y: Math.round((CANVAS_H - s.h) / 2) }));
        };

        const standardResizeToCanvas = (
          sourceImg,
          sx,
          sy,
          sw,
          sh,
          targetCanvas,
        ) => {
          const ctx = targetCanvas.getContext("2d");
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = "high";
          ctx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
          ctx.fillStyle = BG_COLOR;
          ctx.fillRect(0, 0, targetCanvas.width, targetCanvas.height);
          ctx.drawImage(
            sourceImg,
            sx,
            sy,
            sw,
            sh,
            0,
            0,
            targetCanvas.width,
            targetCanvas.height,
          );
        };

        const detailPreservingResize = (
          sourceImg,
          sx,
          sy,
          sw,
          sh,
          targetCanvas,
        ) => {
          const first = document.createElement("canvas");
          first.width = sw;
          first.height = sh;
          const fctx = first.getContext("2d");
          fctx.imageSmoothingEnabled = true;
          fctx.imageSmoothingQuality = "high";
          fctx.drawImage(sourceImg, sx, sy, sw, sh, 0, 0, sw, sh);

          const targetW = targetCanvas.width;
          const targetH = targetCanvas.height;

          let cur = first;
          if (targetW > sw || targetH > sh) {
            const tctx = targetCanvas.getContext("2d");
            tctx.imageSmoothingEnabled = true;
            tctx.imageSmoothingQuality = "high";
            tctx.clearRect(0, 0, targetW, targetH);
            tctx.fillStyle = BG_COLOR;
            tctx.fillRect(0, 0, targetW, targetH);
            tctx.drawImage(
              cur,
              0,
              0,
              cur.width,
              cur.height,
              0,
              0,
              targetW,
              targetH,
            );
            applyUnsharpMask(targetCanvas, 0.6, 1);
            return;
          }

          let next;
          while (cur.width / 2 > targetW && cur.height / 2 > targetH) {
            next = document.createElement("canvas");
            next.width = Math.max(Math.round(cur.width / 2), targetW);
            next.height = Math.max(Math.round(cur.height / 2), targetH);
            const nctx = next.getContext("2d");
            nctx.imageSmoothingEnabled = true;
            nctx.imageSmoothingQuality = "high";
            nctx.clearRect(0, 0, next.width, next.height);
            nctx.drawImage(
              cur,
              0,
              0,
              cur.width,
              cur.height,
              0,
              0,
              next.width,
              next.height,
            );
            cur = next;
          }

          const tctx = targetCanvas.getContext("2d");
          tctx.imageSmoothingEnabled = true;
          tctx.imageSmoothingQuality = "high";
          tctx.clearRect(0, 0, targetW, targetH);
          tctx.fillStyle = BG_COLOR;
          tctx.fillRect(0, 0, targetW, targetH);
          tctx.drawImage(
            cur,
            0,
            0,
            cur.width,
            cur.height,
            0,
            0,
            targetW,
            targetH,
          );

          applyUnsharpMask(targetCanvas, 0.8, 1);
        };

        const applyUnsharpMask = (canvas, amount = 0.7, radius = 1) => {
          try {
            const w = canvas.width;
            const h = canvas.height;
            const ctx = canvas.getContext("2d");
            const original = ctx.getImageData(0, 0, w, h);
            const blurredCanvas = document.createElement("canvas");
            blurredCanvas.width = w;
            blurredCanvas.height = h;
            const bctx = blurredCanvas.getContext("2d");
            bctx.filter = `blur(${radius}px)`;
            bctx.drawImage(canvas, 0, 0, w, h);
            const blurred = bctx.getImageData(0, 0, w, h);

            const out = ctx.createImageData(w, h);
            const ori = original.data;
            const blu = blurred.data;
            const dst = out.data;
            for (let i = 0; i < ori.length; i += 4) {
              for (let c = 0; c < 3; c++) {
                const o = ori[i + c];
                const b = blu[i + c];
                let val = o + amount * (o - b);
                dst[i + c] = Math.max(0, Math.min(255, Math.round(val)));
              }
              dst[i + 3] = ori[i + 3];
            }
            ctx.putImageData(out, 0, 0);
          } catch (e) {
            console.warn("Unsharp mask failed:", e);
          }
        };

        const downloadPNG = async () => {
          if (!imageObj) return;
          setIsProcessing(true);
          const final = document.createElement("canvas");
          final.width = CANVAS_W;
          final.height = CANVAS_H;
          const fctx = final.getContext("2d");
          fctx.fillStyle = BG_COLOR;
          fctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

          const temp = document.createElement("canvas");
          temp.width = imgState.w;
          temp.height = imgState.h;

          if (resizeAlgorithm === "standard") {
            standardResizeToCanvas(
              imageObj,
              0,
              0,
              imageObj.width,
              imageObj.height,
              temp,
            );
            const tctx = temp.getContext("2d");
            tctx.clearRect(0, 0, temp.width, temp.height);
            tctx.imageSmoothingEnabled = true;
            tctx.imageSmoothingQuality = "high";
            tctx.drawImage(
              imageObj,
              0,
              0,
              imageObj.width,
              imageObj.height,
              0,
              0,
              temp.width,
              temp.height,
            );
          } else {
            detailPreservingResize(
              imageObj,
              0,
              0,
              imageObj.width,
              imageObj.height,
              temp,
            );
          }

          fctx.drawImage(temp, imgState.x, imgState.y, imgState.w, imgState.h);

          final.toBlob((blob) => {
            if (!blob) {
              setIsProcessing(false);
              return;
            }
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "resized-image.png";
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            setIsProcessing(false);
          }, "image/png");
        };

        return (
          <div ref={containerRef} className="p-4 sm:p-6 max-w-full">
            <div className="flex flex-col sm:flex-row gap-4 mb-4 items-start sm:items-center flex-wrap">
              <label className="flex items-center gap-2 text-sm sm:text-base">
                <input
                  type="file"
                  accept="image/*"
                  onChange={onFile}
                  className="text-sm sm:text-base cursor-pointer file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-slate-700 file:text-white hover:file:bg-slate-600"
                />
              </label>

              <label className="flex items-center gap-2 text-sm sm:text-base cursor-pointer">
                <input
                  type="checkbox"
                  checked={keepAspect}
                  onChange={(e) => setKeepAspect(e.target.checked)}
                  className="cursor-pointer"
                />
                <span>Keep aspect ratio</span>
              </label>

              <label className="flex flex-col sm:flex-row items-start sm:items-center gap-2 text-sm sm:text-base">
                <span>Algorithm</span>
                <select
                  value={resizeAlgorithm}
                  onChange={(e) => setResizeAlgorithm(e.target.value)}
                  className="px-2 py-1 rounded border border-[#333] bg-[#1a1a1a] text-[#eee] cursor-pointer text-sm sm:text-base"
                >
                  <option value="detail-preserve">
                    Detail-preserving (approx)
                  </option>
                  <option value="standard">Standard high-quality</option>
                </select>
              </label>

              <button
                className="px-3 py-1.5 rounded bg-slate-700 hover:bg-slate-600 text-white text-sm sm:text-base transition-colors"
                onClick={centerHorizontally}
              >
                Center horizontally
              </button>
              <button
                className="px-3 py-1.5 rounded bg-slate-700 hover:bg-slate-600 text-white text-sm sm:text-base transition-colors"
                onClick={centerVertically}
              >
                Center vertically
              </button>
              <button
                className="px-3 py-1.5 rounded bg-green-700 hover:bg-green-600 text-white text-sm sm:text-base transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                onClick={downloadPNG}
                disabled={!imageObj || isProcessing}
              >
                {isProcessing ? "Processing..." : "Download PNG"}
              </button>
            </div>

            <div className="mb-4">
              <label className="flex items-center gap-2 text-sm sm:text-base cursor-pointer">
                <input
                  type="checkbox"
                  checked={showOverlay}
                  onChange={(e) => setShowOverlay(e.target.checked)}
                  className="cursor-pointer"
                />
                <span>Show overlay guide</span>
              </label>
              <div className="text-xs sm:text-sm text-slate-400 mt-1">
                Overlay is visual-only (keeps transparency) and will NOT be
                included in downloads.
              </div>
            </div>

            <div
              className="border border-[#333] w-full overflow-auto -mx-4 sm:mx-0 px-2 sm:px-0 touch-pan-x touch-pan-y"
              style={{ maxHeight: "100dvh" }}
            >
              <div
                className="border border-[#333] inline-block"
                style={{
                  width: CANVAS_W,
                  height: CANVAS_H,
                  transform: `scale(${canvasScale})`,
                  transformOrigin: "top left",
                }}
              >
                <canvas
                  ref={canvasRef}
                  className="block cursor-move"
                  style={{ background: BG_COLOR }}
                />
              </div>
            </div>

            <div className="mt-4 grid grid-cols-1 lg:grid-cols-2 gap-4">
              <div>
                <h4 className="font-semibold text-sm sm:text-base mb-2">
                  Image position & size
                </h4>
                <div className="flex flex-wrap gap-2 items-center mt-2">
                  <label className="flex items-center gap-1 text-sm sm:text-base">
                    X:{" "}
                    <input
                      className="ml-1 w-20 sm:w-24 px-2 py-1 rounded border border-[#333] bg-[#1a1a1a] text-[#eee] text-sm"
                      type="number"
                      value={imgState.x}
                      onChange={(e) =>
                        setImgState((s) => ({
                          ...s,
                          x: parseInt(e.target.value || 0),
                        }))
                      }
                    />
                  </label>
                  <label className="flex items-center gap-1 text-sm sm:text-base">
                    Y:{" "}
                    <input
                      className="ml-1 w-20 sm:w-24 px-2 py-1 rounded border border-[#333] bg-[#1a1a1a] text-[#eee] text-sm"
                      type="number"
                      value={imgState.y}
                      onChange={(e) =>
                        setImgState((s) => ({
                          ...s,
                          y: parseInt(e.target.value || 0),
                        }))
                      }
                    />
                  </label>
                  <label className="flex items-center gap-1 text-sm sm:text-base">
                    W:{" "}
                    <input
                      className="ml-1 w-20 sm:w-24 px-2 py-1 rounded border border-[#333] bg-[#1a1a1a] text-[#eee] text-sm"
                      type="number"
                      value={imgState.w}
                      onChange={(e) => {
                        const v = parseInt(e.target.value || 0);
                        if (keepAspect)
                          setImgState((s) => ({
                            ...s,
                            w: v,
                            h: Math.round(v / origAspect),
                          }));
                        else setImgState((s) => ({ ...s, w: v }));
                      }}
                    />
                  </label>
                  <label className="flex items-center gap-1 text-sm sm:text-base">
                    H:{" "}
                    <input
                      className="ml-1 w-20 sm:w-24 px-2 py-1 rounded border border-[#333] bg-[#1a1a1a] text-[#eee] text-sm"
                      type="number"
                      value={imgState.h}
                      onChange={(e) => {
                        const v = parseInt(e.target.value || 0);
                        if (keepAspect)
                          setImgState((s) => ({
                            ...s,
                            h: v,
                            w: Math.round(v * origAspect),
                          }));
                        else setImgState((s) => ({ ...s, h: v }));
                      }}
                    />
                  </label>
                </div>
                {/* DPI manual override (scales uploaded image only) */}
                <div className="flex flex-wrap items-center gap-2 mt-2">
                  <label className="flex items-center gap-1 text-sm sm:text-base">
                    DPI override:
                    <input
                      type="number"
                      min="1"
                      step="1"
                      placeholder="300"
                      value={dpiOverride}
                      onChange={(e) => setDpiOverride(e.target.value)}
                      className="ml-2 px-2 py-1 rounded border border-[#333] bg-[#1a1a1a] text-[#eee] text-sm w-20 sm:w-24"
                      title="Scale = 1200 / DPI. Scryfall scans are always 300 dpi."
                    />
                  </label>

                  <button
                    type="button"
                    className="px-2 py-1 rounded border border-[#333] bg-[#1a1a1a] text-[#eee] hover:bg-[#2a2a2a] text-sm transition-colors cursor-pointer"
                    onClick={() => setDpiOverride(270)}
                    title="Apply 270 DPI (≈444%)"
                  >
                    270 DPI
                  </button>

                  <button
                    type="button"
                    className="px-2 py-1 rounded border border-[#333] bg-[#1a1a1a] text-[#eee] hover:bg-[#2a2a2a] text-sm transition-colors cursor-pointer"
                    onClick={() => setDpiOverride(300)}
                    title="Apply 300 DPI (400%) — Scryfall"
                  >
                    300 DPI
                  </button>

                  <span className="text-xs sm:text-sm text-gray-400">
                    scryfall scans are always 300 dpi
                  </span>

                  <button
                    type="button"
                    className="px-2 py-1 rounded border border-[#333] bg-[#1a1a1a] text-[#eee] hover:bg-[#2a2a2a] text-sm transition-colors cursor-pointer"
                    onClick={() => setDpiOverride("")}
                  >
                    Clear
                  </button>
                </div>
              </div>

              <div>
                <h4 className="font-semibold text-sm sm:text-base mb-2">
                  Hints
                </h4>
                <ul className="list-disc ml-5 mt-2 text-xs sm:text-sm space-y-1">
                  <li>
                    Click and drag image to move it; use corner handles to
                    resize.
                  </li>
                  <li>Use arrow keys to nudge by 1 pixel.</li>
                  <li>
                    Canvas internal size: {CANVAS_W} × {CANVAS_H} px (preview
                    scaled down).
                  </li>
                  <li>Background color: {BG_COLOR}.</li>
                  <li>
                    Download creates a lossless PNG combining background + image
                    at current position/size.
                  </li>
                  <li>
                    Overlay (if shown) is a visual guide only and won't be
                    exported.
                  </li>
                </ul>
              </div>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<DetailPreserveImageResizer />);
    </script>

System Role: High-Fidelity Neutral Photo Extender.

   - ALLOWED: Completing objects cut off by the frame (e.g., finishing a pipe downwards, extending a wall sideways).

    <script>
      // Copy-to-clipboard behavior for the two outpaint boxes.
      (function () {
        function copyHandler(e) {
          e.preventDefault();
          e.stopPropagation();

          const targetId = e.currentTarget.getAttribute("data-target");
          const ta = document.getElementById(targetId);
          if (!ta) return;
          const text = ta.value;

          if (!text || text.trim() === "") {
            alert("Nothing to copy");
            return;
          }

          const button = e.currentTarget;
          const originalText = button.innerText;

          // Try modern clipboard API first
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard
              .writeText(text)
              .then(() => {
                button.innerText = "Copied!";
                setTimeout(() => {
                  button.innerText = originalText;
                }, 1400);
              })
              .catch((err) => {
                console.warn("Clipboard API failed:", err);
                // Fallback to execCommand with temporary element
                fallbackCopyWithTempElement(text, button, originalText);
              });
          } else {
            // Very old browsers fallback
            fallbackCopyWithTempElement(text, button, originalText);
          }
        }

        function fallbackCopyWithTempElement(text, button, originalText) {
          // Create a temporary textarea element for copying (more reliable)
          const tempTextarea = document.createElement("textarea");
          tempTextarea.value = text;
          tempTextarea.style.position = "fixed";
          tempTextarea.style.left = "-999999px";
          tempTextarea.style.top = "-999999px";
          tempTextarea.style.opacity = "0";
          tempTextarea.setAttribute("readonly", "");
          document.body.appendChild(tempTextarea);

          // Focus and select
          tempTextarea.focus();
          tempTextarea.select();
          tempTextarea.setSelectionRange(0, text.length);

          try {
            const successful = document.execCommand("copy");
            document.body.removeChild(tempTextarea);

            if (successful) {
              button.innerText = "Copied!";
              setTimeout(() => {
                button.innerText = originalText;
              }, 1400);
            } else {
              // Last resort: try with original textarea
              fallbackCopyOriginal(text, button, originalText);
            }
          } catch (err) {
            document.body.removeChild(tempTextarea);
            console.warn("execCommand failed:", err);
            // Last resort: try with original textarea
            fallbackCopyOriginal(text, button, originalText);
          }
        }

        function fallbackCopyOriginal(text, button, originalText) {
          // Try to find and use the original textarea
          const targetId = button.getAttribute("data-target");
          const ta = document.getElementById(targetId);
          if (ta) {
            ta.focus();
            ta.select();
            ta.setSelectionRange(0, text.length);

            try {
              const successful = document.execCommand("copy");
              if (successful) {
                button.innerText = "Copied!";
                setTimeout(() => {
                  button.innerText = originalText;
                }, 1400);
                return;
              }
            } catch (err) {
              console.warn("Original textarea copy failed:", err);
            }
          }

          // If all else fails, show helpful message
          alert(
            "Copy failed — please select the text manually and press Ctrl/Cmd+C",
          );
        }

        document.addEventListener("DOMContentLoaded", function () {
          document.querySelectorAll(".copy-btn").forEach(function (btn) {
            btn.addEventListener("click", copyHandler);
          });
        });
      })();
    </script>
