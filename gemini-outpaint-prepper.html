      ctx.fillText("Drop or upload an image to start", 40, 64);
    }

    if (showOverlay && overlayObj) {
      ctx.drawImage(overlayObj, 0, 0, CANVAS_W, CANVAS_H);
    }
  }, [imageObj, imgState, showOverlay, overlayObj]);

  useEffect(() => {
    const preview = canvasRef.current;
    if (!preview) return;
    preview.width = CANVAS_W;
    preview.height = CANVAS_H;
    drawPreview();
  }, [drawPreview]);

  useEffect(() => drawPreview(), [drawPreview, imgState, imageObj, showOverlay, overlayObj]);

  const getMousePos = (e) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return { x: Math.round((e.clientX - rect.left) * scaleX), y: Math.round((e.clientY - rect.top) * scaleY) };
  };

  const pointInRect = (px, py, rx, ry, rw, rh) => px >= rx && px <= rx + rw && py >= ry && py <= ry + rh;

  const handleMouseDown = (e) => {
    if (!imageObj) return;
    const pos = getMousePos(e);
    const hs = 18;
    const corners = [
      { cx: imgState.x, cy: imgState.y, name: "nw" },
      { cx: imgState.x + imgState.w, cy: imgState.y, name: "ne" },
      { cx: imgState.x, cy: imgState.y + imgState.h, name: "sw" },
      { cx: imgState.x + imgState.w, cy: imgState.y + imgState.h, name: "se" },
    ];
    for (const c of corners) {
      if (pointInRect(pos.x, pos.y, c.cx - hs / 2, c.cy - hs / 2, hs, hs)) {
        setResizingHandle(c.name);
        setDragging(false);
        return;
      }
    }
    if (pointInRect(pos.x, pos.y, imgState.x, imgState.y, imgState.w, imgState.h)) {
      setDragging(true);
      setResizingHandle(null);
      setDragOffset({ dx: pos.x - imgState.x, dy: pos.y - imgState.y });
    }
  };

  const handleMouseMove = (e) => {
    if (!imageObj) return;
    const pos = getMousePos(e);
    if (dragging) {
      const nx = pos.x - dragOffset.dx;
      const ny = pos.y - dragOffset.dy;
      setImgState((s) => ({ ...s, x: nx, y: ny }));
    } else if (resizingHandle) {
      let { x, y, w, h } = imgState;
      const minSize = 20;
      if (resizingHandle === "nw") {
        const newW = w + (x - pos.x);
        const newH = h + (y - pos.y);
        let finalW = Math.max(minSize, newW);
        let finalH = Math.max(minSize, newH);
        if (keepAspect) {
          const expectedH = Math.round(finalW / origAspect);
          finalH = expectedH;
        }
        const finalX = x + (w - finalW);
        const finalY = y + (h - finalH);
        setImgState({ x: finalX, y: finalY, w: finalW, h: finalH });
      } else if (resizingHandle === "ne") {
        const newW = pos.x - x;
        const newH = h + (y - pos.y);
        let finalW = Math.max(minSize, newW);
        let finalH = Math.max(minSize, newH);
        if (keepAspect) {
          const expectedH = Math.round(finalW / origAspect);
          finalH = expectedH;
        }
        const finalY = y + (h - finalH);
        setImgState({ x, y: finalY, w: finalW, h: finalH });
      } else if (resizingHandle === "sw") {
        const newW = w + (x - pos.x);
        const newH = pos.y - y;
        let finalW = Math.max(minSize, newW);
        let finalH = Math.max(minSize, newH);
        if (keepAspect) {
          finalH = Math.round(finalW / origAspect);
        }
        const finalX = x + (w - finalW);
        setImgState({ x: finalX, y, w: finalW, h: finalH });
      } else if (resizingHandle === "se") {
        const newW = pos.x - x;
        const newH = pos.y - y;
        let finalW = Math.max(minSize, newW);
        let finalH = Math.max(minSize, newH);
        if (keepAspect) {
          finalH = Math.round(finalW / origAspect);
        }
        setImgState({ x, y, w: finalW, h: finalH });
      }
    }
  };

  const handleMouseUp = () => { setDragging(false); setResizingHandle(null); };

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    canvas.addEventListener("mousedown", handleMouseDown);
    window.addEventListener("mousemove", handleMouseMove);
    window.addEventListener("mouseup", handleMouseUp);
    return () => {
      canvas.removeEventListener("mousedown", handleMouseDown);
      window.removeEventListener("mousemove", handleMouseMove);
      window.removeEventListener("mouseup", handleMouseUp);
    };
  }, [imageObj, dragging, dragOffset, resizingHandle, imgState, keepAspect, origAspect]);

  useEffect(() => {
    const onKey = (ev) => {
      if (!imageObj) return;
      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(ev.key)) {
        ev.preventDefault();
        setImgState((s) => {
          if (ev.key === "ArrowLeft") return { ...s, x: s.x - 1 };
          if (ev.key === "ArrowRight") return { ...s, x: s.x + 1 };
          if (ev.key === "ArrowUp") return { ...s, y: s.y - 1 };
          if (ev.key === "ArrowDown") return { ...s, y: s.y + 1 };
          return s;
        });
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [imageObj]);

  const centerHorizontally = () => { setImgState((s) => ({ ...s, x: Math.round((CANVAS_W - s.w) / 2) })); };
  const centerVertically = () => { setImgState((s) => ({ ...s, y: Math.round((CANVAS_H - s.h) / 2) })); };

  const standardResizeToCanvas = (sourceImg, sx, sy, sw, sh, targetCanvas) => {
    const ctx = targetCanvas.getContext("2d");
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
    ctx.fillStyle = BG_COLOR;
    ctx.fillRect(0, 0, targetCanvas.width, targetCanvas.height);
    ctx.drawImage(sourceImg, sx, sy, sw, sh, 0, 0, targetCanvas.width, targetCanvas.height);
  };

  const detailPreservingResize = (sourceImg, sx, sy, sw, sh, targetCanvas) => {
    const first = document.createElement("canvas");
    first.width = sw;
    first.height = sh;
    const fctx = first.getContext("2d");
    fctx.imageSmoothingEnabled = true;
    fctx.imageSmoothingQuality = "high";
    fctx.drawImage(sourceImg, sx, sy, sw, sh, 0, 0, sw, sh);

    const targetW = targetCanvas.width;
    const targetH = targetCanvas.height;

    let cur = first;
    if (targetW > sw || targetH > sh) {
      const tctx = targetCanvas.getContext("2d");
      tctx.imageSmoothingEnabled = true;
      tctx.imageSmoothingQuality = "high";
      tctx.clearRect(0, 0, targetW, targetH);
      tctx.fillStyle = BG_COLOR;
      tctx.fillRect(0, 0, targetW, targetH);
      tctx.drawImage(cur, 0, 0, cur.width, cur.height, 0, 0, targetW, targetH);
      applyUnsharpMask(targetCanvas, 0.6, 1);
      return;
    }

    let next;
    while (cur.width / 2 > targetW && cur.height / 2 > targetH) {
      next = document.createElement("canvas");
      next.width = Math.max(Math.round(cur.width / 2), targetW);
      next.height = Math.max(Math.round(cur.height / 2), targetH);
      const nctx = next.getContext("2d");
      nctx.imageSmoothingEnabled = true;
      nctx.imageSmoothingQuality = "high";
      nctx.clearRect(0, 0, next.width, next.height);
      nctx.drawImage(cur, 0, 0, cur.width, cur.height, 0, 0, next.width, next.height);
      cur = next;
    }

    const tctx = targetCanvas.getContext("2d");
    tctx.imageSmoothingEnabled = true;
    tctx.imageSmoothingQuality = "high";
    tctx.clearRect(0, 0, targetW, targetH);
    tctx.fillStyle = BG_COLOR;
    tctx.fillRect(0, 0, targetW, targetH);
    tctx.drawImage(cur, 0, 0, cur.width, cur.height, 0, 0, targetW, targetH);

    applyUnsharpMask(targetCanvas, 0.8, 1);
  };

  const applyUnsharpMask = (canvas, amount = 0.7, radius = 1) => {
    try {
      const w = canvas.width;
      const h = canvas.height;
      const ctx = canvas.getContext("2d");
      const original = ctx.getImageData(0, 0, w, h);
      const blurredCanvas = document.createElement("canvas");
      blurredCanvas.width = w;
      blurredCanvas.height = h;
      const bctx = blurredCanvas.getContext("2d");
      bctx.filter = `blur(${radius}px)`;
      bctx.drawImage(canvas, 0, 0, w, h);
      const blurred = bctx.getImageData(0, 0, w, h);

      const out = ctx.createImageData(w, h);
      const ori = original.data;
      const blu = blurred.data;
      const dst = out.data;
      for (let i = 0; i < ori.length; i += 4) {
        for (let c = 0; c < 3; c++) {
          const o = ori[i + c];
          const b = blu[i + c];
          let val = o + amount * (o - b);
          dst[i + c] = Math.max(0, Math.min(255, Math.round(val)));
        }
        dst[i + 3] = ori[i + 3];
      }
      ctx.putImageData(out, 0, 0);
    } catch (e) {
      console.warn("Unsharp mask failed:", e);
    }
  };

  const downloadPNG = async () => {
    if (!imageObj) return;
    setIsProcessing(true);
    const final = document.createElement("canvas");
    final.width = CANVAS_W;
    final.height = CANVAS_H;
    const fctx = final.getContext("2d");
    fctx.fillStyle = BG_COLOR;
    fctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    const temp = document.createElement("canvas");
    temp.width = imgState.w;
    temp.height = imgState.h;

    if (resizeAlgorithm === "standard") {
      standardResizeToCanvas(imageObj, 0, 0, imageObj.width, imageObj.height, temp);
      const tctx = temp.getContext("2d");
      tctx.clearRect(0, 0, temp.width, temp.height);
      tctx.imageSmoothingEnabled = true;
      tctx.imageSmoothingQuality = "high";
      tctx.drawImage(imageObj, 0, 0, imageObj.width, imageObj.height, 0, 0, temp.width, temp.height);
    } else {
      detailPreservingResize(imageObj, 0, 0, imageObj.width, imageObj.height, temp);
    }

    fctx.drawImage(temp, imgState.x, imgState.y, imgState.w, imgState.h);

    final.toBlob((blob) => {
      if (!blob) { setIsProcessing(false); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "resized-image.png";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      setIsProcessing(false);
    }, "image/png");
  };

  return (
    <div ref={containerRef} className="p-4 max-w-full">
      <div className="flex gap-4 mb-4 items-center">
        <label className="flex items-center gap-2">
          <input type="file" accept="image/*" onChange={onFile} />
        </label>

        <label className="flex items-center gap-2">
          <input type="checkbox" checked={keepAspect} onChange={(e) => setKeepAspect(e.target.checked)} /> Keep aspect ratio
        </label>

        <label className="flex items-center gap-2">
          <span>Algorithm</span>
          <select value={resizeAlgorithm} onChange={(e) => setResizeAlgorithm(e.target.value)} className="ml-2">
            <option value="detail-preserve">Detail-preserving (approx)</option>
            <option value="standard">Standard high-quality</option>
          </select>
        </label>

        <button className="px-3 py-1 rounded bg-slate-700 text-white" onClick={centerHorizontally}>
          Center horizontally
        </button>
        <button className="px-3 py-1 rounded bg-slate-700 text-white" onClick={centerVertically}> 
          Center vertically
        </button>
        <button className="px-3 py-1 rounded bg-green-700 text-white" onClick={downloadPNG} disabled={!imageObj || isProcessing}>
          {isProcessing ? "Processing..." : "Download PNG"}
        </button>
      </div>

      <div className="mb-4">
        <label className="flex items-center gap-2">
          <input type="checkbox" checked={showOverlay} onChange={(e) => setShowOverlay(e.target.checked)} /> Show overlay guide
        </label>
        <div className="text-sm text-slate-400">Overlay is visual-only (keeps transparency) and will NOT be included in downloads.</div>
      </div>

      <div className="border" style={{ width: "100%", overflow: "auto" }}>
        <div style={{ width: CANVAS_W, height: CANVAS_H, transform: "scale(0.25)", transformOrigin: "top left", border: "1px solid #333" }}>
          <canvas ref={canvasRef} style={{ background: BG_COLOR, display: "block", cursor: "move" }} />
        </div>
      </div>

      <div className="mt-4 grid grid-cols-2 gap-4">
        <div>
          <h4 className="font-semibold">Image position & size</h4>
          <div className="flex gap-2 items-center mt-2">
            <label className="flex items-center gap-1">X: <input className="ml-1 w-24" type="number" value={imgState.x} onChange={(e) => setImgState((s) => ({ ...s, x: parseInt(e.target.value || 0) }))} /></label>
            <label className="flex items-center gap-1">Y: <input className="ml-1 w-24" type="number" value={imgState.y} onChange={(e) => setImgState((s) => ({ ...s, y: parseInt(e.target.value || 0) }))} /></label>
            <label className="flex items-center gap-1">W: <input className="ml-1 w-24" type="number" value={imgState.w} onChange={(e) => { const v = parseInt(e.target.value || 0); if (keepAspect) setImgState((s) => ({ ...s, w: v, h: Math.round(v / origAspect) })); else setImgState((s) => ({ ...s, w: v })); }} /></label>
            <label className="flex items-center gap-1">H: <input className="ml-1 w-24" type="number" value={imgState.h} onChange={(e) => { const v = parseInt(e.target.value || 0); if (keepAspect) setImgState((s) => ({ ...s, h: v, w: Math.round(v * origAspect) })); else setImgState((s) => ({ ...s, h: v })); }} /></label>
          </div>
{/* DPI manual override (scales uploaded image only) */}
<div className="flex items-center gap-2 mt-2 flex-wrap">
  <label className="flex items-center gap-1">
    DPI override:
    <input
      type="number"
      min="1"
      step="1"
      placeholder="300"
      value={dpiOverride}
      onChange={(e) => setDpiOverride(e.target.value)}
      className="ml-2 px-2 py-1 rounded border bg-black/60 text-sm w-24"
      title='Scale = 1200 / DPI. Scryfall scans are always 300 dpi.'
    />
  </label>

  <button
    type="button"
    className="px-2 py-1 rounded border text-sm"
    onClick={() => setDpiOverride(270)}
    title="Apply 270 DPI (≈444%)"
  >
    270 DPI
  </button>

  <button
    type="button"
    className="px-2 py-1 rounded border text-sm"
    onClick={() => setDpiOverride(300)}
    title="Apply 300 DPI (400%) — Scryfall"
  >
    300 DPI
  </button>

  <span className="text-sm text-gray-400">
    scryfall scans are always 300 dpi
  </span>

  <button
    type="button"
    className="px-2 py-1 rounded border text-sm"
    onClick={() => setDpiOverride("")}
  >
    Clear
  </button>
</div>
        </div>

        <div>
          <h4 className="font-semibold">Hints</h4>
          <ul className="list-disc ml-5 mt-2 text-sm">
            <li>Click and drag image to move it; use corner handles to resize.</li>
            <li>Use arrow keys to nudge by 1 pixel.</li>
            <li>Canvas internal size: {CANVAS_W} × {CANVAS_H} px (preview scaled down).</li>
            <li>Background color: {BG_COLOR}.</li>
            <li>Download creates a lossless PNG combining background + image at current position/size.</li>
            <li>Overlay (if shown) is a visual guide only and won't be exported.</li>
          </ul>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<DetailPreserveImageResizer />);

  </script>
</body>
</html>
